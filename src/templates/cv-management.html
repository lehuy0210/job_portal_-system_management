{% extends 'base.html' %}

{% block title %}Quản lý CV của tôi - JobPortal{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/cv-management.css') }}">
{% endblock %}

{% block content %}
<div class="cv-container">
    <div class="cv-header">
        <h2>Quản lý CV của tôi</h2>
        <div class="cv-header-actions">
            <a class="btn btn-outline" href="/screening">Gợi ý việc làm</a>
            <a class="btn btn-outline" href="/lich-su-ung-tuyen">Lịch sử ứng tuyển</a>
            <button class="btn btn-primary" onclick="showForm()">+ Tạo CV mới</button>
        </div>
    </div>

    <!-- Form chỉ còn lại các trường nội dung cốt lõi -->
    <div id="cv-form-container" class="cv-form-container">
        <h3 id="form-title" style="margin-top: 0; margin-bottom: 20px;">Thêm CV mới</h3>
        <form id="cvForm">
            <input type="hidden" id="cv-id">

            <div class="form-group" id="creation-method-group">
                <label>Phương thức tạo CV</label>
                <div style="display: flex; gap: 20px; margin-top: 10px;">
                    <label style="font-weight: normal; cursor: pointer;">
                        <input type="radio" name="cv_method" value="upload" checked onchange="toggleCvMethod()"> Tải file lên
                    </label>
                    <label style="font-weight: normal; cursor: pointer;">
                        <input type="radio" name="cv_method" value="text" onchange="toggleCvMethod()"> Nhập trực tiếp
                    </label>
                </div>
            </div>

            <div class="form-group" id="file-group">
                <label>File CV (PDF/DOCX) <span style="color:red">*</span></label>
                <input type="file" id="cv_file" name="cv_file" class="form-control" accept=".pdf,.doc,.docx" required>
            </div>

            <div id="text-fields-group">
                <div class="form-group">
                <label>Tóm tắt bản thân / Mục tiêu nghề nghiệp</label>
                <textarea id="tom_tat" class="form-control" rows="2" placeholder="Giới thiệu ngắn gọn bản thân..." required></textarea>
            </div>

            <div class="form-group">
                <label>Học vấn</label>
                <textarea id="hoc_van" class="form-control" rows="3" placeholder="Ví dụ: Đại học Mở TP.HCM - Kỹ thuật phần mềm..." required></textarea>
            </div>

            <div class="form-group">
                <label>Kinh nghiệm làm việc</label>
                <textarea id="kinh_nghiem" class="form-control" rows="3" placeholder="Mô tả các dự án hoặc kinh nghiệm làm việc..."></textarea>
            </div>
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn btn-primary">Lưu CV</button>
                <button type="button" class="btn btn-outline" onclick="hideForm()">Hủy</button>
            </div>
        </form>
    </div>

    <table class="cv-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tóm tắt nội dung</th>
                <th>Trạng thái / Bản in</th>
                <th class="cv-actions">Thao tác</th>
            </tr>
        </thead>
        <tbody id="cv-list">
        </tbody>
    </table>
</div>

<script>
    const role = localStorage.getItem('ma_vai_tro');
    const token = localStorage.getItem('access_token');
    let cvListCache = [];

    if (!token || role !== "1") {
        showToast("Chỉ ứng viên đã đăng nhập mới có quyền truy cập trang này.", "danger");
        window.location.href = "/";
    }

    function getAuthHeaders() {
        return {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        };
    }

    document.addEventListener("DOMContentLoaded", loadCVs);

    window.showForm = function() {
        document.getElementById('cv-form-container').style.display = "block";
        document.getElementById('form-title').innerText = "Thêm CV mới";
        document.getElementById('cv-id').value = "";
        document.getElementById('cvForm').reset();
        
        document.getElementById('creation-method-group').style.display = "block";
        document.querySelector('input[name="cv_method"][value="upload"]').checked = true;
        toggleCvMethod();
    }

    window.hideForm = function() {
        document.getElementById('cv-form-container').style.display = "none";
    }

    window.toggleCvMethod = function() {
        const method = document.querySelector('input[name="cv_method"]:checked').value;
        if (method === 'upload') {
            document.getElementById('file-group').style.display = 'block';
            document.getElementById('cv_file').required = true;
            document.getElementById('tom_tat').required = false;
            document.getElementById('hoc_van').required = false;
            document.getElementById('kinh_nghiem').required = false;
        } else {
            document.getElementById('file-group').style.display = 'none';
            document.getElementById('cv_file').required = false;
            document.getElementById('cv_file').value = '';
            document.getElementById('tom_tat').required = true;
            document.getElementById('hoc_van').required = true;
            document.getElementById('kinh_nghiem').required = true;
        }
    }

    async function loadCVs() {
        try {
            const res = await fetch(`/api/v1/cv/ung-vien`, {
                method: 'GET',
                headers: getAuthHeaders()
            });

            if (res.status === 401) {
                showToast("Phiên đăng nhập hết hạn, vui lòng đăng nhập lại", "danger");
                localStorage.clear();
                window.location.href = "/login";
                return;
            }

            const result = await res.json();
            cvListCache = result.data || (Array.isArray(result) ? result : (result.items || []));

            const tbody = document.getElementById('cv-list');
            tbody.innerHTML = '';

            if (cvListCache.length > 0) {
                cvListCache.forEach(cv => {
                    const tomTatNgan = cv.tom_tat.length > 50 ? cv.tom_tat.substring(0, 50) + '...' : cv.tom_tat;

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>#${cv.ma_cv}</strong></td>
                            <td>${tomTatNgan}</td>
                            <td>
                                <a href="/cv/preview?id=${cv.ma_cv}" class="btn btn-primary" style="padding: 4px 10px; font-size: 0.8rem; text-decoration: none;">
                                    🖨️ Xem & Tải PDF
                                </a>
                            </td>
                            <td class="cv-actions">
                                <button class="btn btn-outline" onclick="editCV(${cv.ma_cv})">Sửa</button>
                                <button class="btn btn-danger-outline" onclick="deleteCV(${cv.ma_cv})">Xóa</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 30px; color: #6c757d;">Bạn chưa tạo CV nào.</td></tr>`;
            }
        } catch (error) {
            showToast("Lỗi khi tải danh sách CV", "danger");
        }
    }

    document.getElementById('cvForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const cvId = document.getElementById('cv-id').value;
        const method = cvId ? 'PUT' : 'POST';
        const url = cvId ? `/api/v1/cv/${cvId}` : '/api/v1/cv/';

        let bodyData;
        let fetchHeaders = {
            'Authorization': `Bearer ${localStorage.getItem('access_token')}`
        };

        if (!cvId) {
            const methodChoice = document.querySelector('input[name="cv_method"]:checked').value;

            if (methodChoice === 'upload') {
                // TẠO MỚI (POST): Gửi dưới dạng multipart/form-data
                const fileInput = document.getElementById('cv_file');
                if (fileInput.files.length === 0) {
                    showToast("Vui lòng chọn file CV", "danger");
                    return;
                }

                bodyData = new FormData();
                bodyData.append('cv_file', fileInput.files[0]);
                bodyData.append('tom_tat', document.getElementById('tom_tat').value);
                bodyData.append('hoc_van', document.getElementById('hoc_van').value);
                bodyData.append('kinh_nghiem', document.getElementById('kinh_nghiem').value);
            } else {
                // TẠO MỚI (POST): Nhập trực tiếp
                bodyData = JSON.stringify({
                    tom_tat: document.getElementById('tom_tat').value || 'Không có tóm tắt',
                    hoc_van: document.getElementById('hoc_van').value || 'Không có học vấn',
                    kinh_nghiem_lam_viec: document.getElementById('kinh_nghiem').value || 'Không có kinh nghiệm',
                    duong_dan: "Tự tạo trên hệ thống",
                    source: "JobPortal"
                });
                fetchHeaders['Content-Type'] = 'application/json';
            }
        } else {
            // CẬP NHẬT (PUT): Gửi dưới dạng JSON
            bodyData = JSON.stringify({
                tom_tat: document.getElementById('tom_tat').value,
                hoc_van: document.getElementById('hoc_van').value,
                kinh_nghiem_lam_viec: document.getElementById('kinh_nghiem').value,
                duong_dan: "Đã cập nhật",
                source: "JobPortal"
            });
            fetchHeaders['Content-Type'] = 'application/json';
        }

        try {
            const res = await fetch(url, {
                method: method,
                headers: fetchHeaders,
                body: bodyData
            });

            if (res.ok) {
                showToast(cvId ? "Cập nhật CV thành công!" : "Tạo CV thành công!", "success");
                hideForm();
                loadCVs();
            } else {
                const errorData = await res.json();
                showToast(errorData.message || "Có lỗi xảy ra", "danger");
            }
        } catch (error) {
            showToast("Không thể kết nối máy chủ", "danger");
        }
    });

    window.editCV = function(id) {
        const cv = cvListCache.find(c => c.ma_cv === id);
        if (cv) {
            document.getElementById('cv-form-container').style.display = "block";
            document.getElementById('form-title').innerText = "Chỉnh sửa CV #" + id;
            document.getElementById('cv-id').value = id;
            document.getElementById('tom_tat').value = cv.tom_tat;
            document.getElementById('hoc_van').value = cv.hoc_van;
            document.getElementById('kinh_nghiem').value = cv.kinh_nghiem_lam_viec;
            
            // Ẩn upload file và method selector khi edit
            document.getElementById('creation-method-group').style.display = "none";
            document.getElementById('file-group').style.display = "none";
            document.getElementById('cv_file').required = false;
        }
    }

    async function deleteCV(cvId) {
        if (!confirm("Bạn có chắc chắn muốn xóa CV này không? Hành động này không thể hoàn tác.")) return;

        try {
            const res = await fetch(`/api/v1/cv/${cvId}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });

            if (res.ok) {
                showToast("Xóa CV thành công!", "success");
                loadCVs();
            } else {
                showToast("Xóa thất bại!", "danger");
            }
        } catch (error) {
            showToast("Lỗi kết nối", "danger");
        }
    }
</script>
{% endblock %}
